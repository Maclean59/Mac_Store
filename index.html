<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Macstore</title>
    <meta name="theme-color" content="#f68b1e" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Macstore" />
    <style>
      :root {
        --or: #f68b1e;
        --ink: #282828;
        --mut: #75757a;
        --bg: #f1f1f2;
        --green: #00a651;
        --red: #e5252a;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        padding-bottom: 70px;
      }
      header {
        background: var(--or);
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 10px 12px;
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .logo {
        font-weight: 800;
        font-size: 22px;
        color: #fff;
        cursor: pointer;
      }
      #q {
        flex: 1;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        min-width: 0;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 10px;
      }
      .banner {
        background: linear-gradient(120deg, #282828, #f68b1e);
        color: #fff;
        border-radius: 12px;
        padding: 18px 16px;
        margin-bottom: 10px;
      }
      .banner h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .banner p {
        margin: 0;
        opacity: 0.9;
      }
      .cats {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 8px 2px 12px;
        scrollbar-width: none;
      }
      .cat {
        flex: 0 0 auto;
        text-align: center;
        width: 68px;
        font-size: 12px;
        cursor: pointer;
        background: none;
        border: 0;
        color: var(--ink);
        padding: 0;
      }
      .cat i {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #fff;
        font-style: normal;
        font-size: 24px;
        margin: 0 auto 4px;
        border: 2px solid transparent;
      }
      .cat.on i {
        border-color: var(--or);
      }
      .sec {
        background: #fff;
        border-radius: 10px;
        padding: 10px;
      }
      .sec h2 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      @media (min-width: 600px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      .card {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 1px 3px #0002;
      }
      .card img,
      .ph {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: #eee;
        display: grid;
        place-items: center;
        font-size: 36px;
      }
      .card .b {
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .card h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .price {
        font-weight: 700;
        font-size: 16px;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: auto;
      }
      button.act {
        flex: 1;
        border: 0;
        border-radius: 6px;
        padding: 8px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: var(--or);
        color: #fff;
      }
      button.sv {
        border: 1px solid #ddd;
        background: #fff;
        color: var(--ink);
        flex: 0 0 40px;
      }
      button.act.g {
        background: var(--green);
      }
      button.act.r {
        background: var(--red);
      }
      .sk {
        height: 210px;
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          #e8e8e8 25%,
          #f5f5f5 50%,
          #e8e8e8 75%
        );
        background-size: 200% 100%;
        animation: sh 1.2s infinite;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
      }
      .box {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        max-width: 460px;
        margin: 10px auto;
        display: grid;
        gap: 10px;
      }
      .box h2 {
        margin: 0;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      .cat:focus-visible {
        outline: 3px solid #2b7de9;
        outline-offset: 2px;
      }
      .msg {
        font-weight: 700;
      }
      .err {
        color: var(--red);
      }
      .ok {
        color: var(--green);
      }
      .empty {
        text-align: center;
        padding: 30px 10px;
        color: var(--mut);
        grid-column: 1/-1;
      }
      .mine {
        display: flex;
        gap: 8px;
        align-items: center;
        background: #fff;
        border-radius: 10px;
        padding: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .mine img {
        width: 52px;
        height: 52px;
        border-radius: 8px;
        object-fit: cover;
      }
      .mine span {
        flex: 1;
        min-width: 120px;
        font-weight: 600;
      }
      .mine.sold {
        opacity: 0.5;
      }
      .mine button {
        flex: 0 0 auto;
        padding: 8px 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      @media (min-width: 600px) {
        .stats {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .stat {
        background: #fff;
        border-radius: 10px;
        padding: 14px;
        color: var(--mut);
      }
      .stat b {
        display: block;
        font-size: 28px;
        color: var(--or);
      }
      .mine small {
        display: block;
        color: var(--mut);
        font-weight: 400;
      }
      .mine select {
        width: auto;
        flex: 0 0 auto;
        padding: 8px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        background: #f1f1f2;
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 11px;
        color: var(--mut);
        align-self: flex-start;
      }
      .lnk {
        display: block;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        text-decoration: none;
        margin-top: 8px;
        cursor: pointer;
        text-align: center;
      }
      .rvs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 6px;
        scrollbar-width: none;
      }
      .rv {
        flex: 0 0 230px;
        background: #fff;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 1px 3px #0002;
      }
      .rv .st {
        color: var(--or);
        letter-spacing: 1px;
      }
      .rv p {
        margin: 4px 0;
      }
      .rv small {
        color: var(--mut);
      }
      .code {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--or);
        text-align: center;
        background: #fff6ec;
        border-radius: 10px;
        padding: 10px;
      }
      .gal img.big {
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
        background: #eee;
        border-radius: 10px;
      }
      .thumbs {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        overflow-x: auto;
      }
      .thumbs img {
        width: 56px;
        height: 56px;
        object-fit: cover;
        border-radius: 6px;
        cursor: pointer;
        border: 2px solid transparent;
      }
      table.dt {
        width: 100%;
        border-collapse: collapse;
      }
      table.dt td {
        padding: 6px 4px;
        border-bottom: 1px solid #eee;
      }
      table.dt td:first-child {
        color: var(--mut);
        width: 40%;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        display: flex;
        justify-content: space-around;
        border-top: 1px solid #ddd;
        padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
        z-index: 9;
      }
      nav button {
        background: none;
        border: 0;
        font: inherit;
        font-size: 11px;
        color: var(--mut);
        display: grid;
        justify-items: center;
        gap: 2px;
        cursor: pointer;
        flex: 1;
        min-width: 0;
      }
      nav button b {
        font-size: 21px;
        font-weight: 400;
      }
      nav button.on {
        color: var(--or);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo" onclick="go('home')">Macstore</div>
      <input
        id="q"
        type="search"
        placeholder="Search products"
        aria-label="Search products"
      />
    </header>
    <main id="app"></main>
    <nav id="tabs"></nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script>
      // Paste the URL and publishable key of the Supabase project you are using (Connect button). Never the secret key.
      const SUPABASE_URL = "https://bckjpwkccpyvekbohoyp.supabase.co";
      const SUPABASE_KEY = "sb_publishable_cLpSBudpjWEXZxkGWOydnA_eG_xjhGt";

      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const app = document.getElementById("app");
      const $ = (id) => document.getElementById(id);
      const CATS = [
        ["All", "🏠"],
        ["Fashion", "👕"],
        ["Phones", "📱"],
        ["Electronics", "🔌"],
        ["Home", "🛋️"],
        ["Beauty", "💄"],
        ["Food", "🍲"],
        ["Other", "🛍️"],
      ];
      const PAGE = 20;
      let user = null,
        profile = null,
        mode = "login",
        view = "home",
        prev = "home",
        EDIT = null,
        CAN_ADD = false,
        deferredPrompt = null,
        st = { q: "", cat: "All", from: 0, done: false, busy: false },
        io = null;

      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const money = (n) => "GH₵ " + Number(n).toFixed(2);
      const stars = (n) => "★".repeat(n) + "☆".repeat(5 - n);
      const chips = (d) =>
        Object.entries(d || {})
          .map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(v)}</span>`)
          .join("");

      /* STOCK LEVELS: in stock, low stock, few left, out of stock */
      const STOCK = {
        in: ["In stock", ""],
        low: ["Low stock", "#e8890c"],
        few: ["Few left", "#e5252a"],
        out: ["Out of stock", "#75757a"],
      };
      const badge = (p) => {
        const s = STOCK[p.stock_level || "in"] || STOCK.in;
        return s[1]
          ? `<span class="chip" style="background:${s[1]};color:#fff">${s[0]}</span>`
          : "";
      };
      const card = (
        p,
      ) => `<div class="card"><div onclick="item('${p.id}')" style="cursor:pointer">${p.images && p.images[0] ? `<img src="${esc(p.images[0])}" alt="${esc(p.title)}" loading="lazy" decoding="async">` : '<div class="ph">🛍️</div>'}</div>
 <div class="b"><h3 onclick="item('${p.id}')" style="cursor:pointer">${esc(p.title)}</h3>${badge(p)}<div class="chips">${chips(p.details)}</div><div class="price">${money(p.price)}</div>
 <div class="row"><button class="act sv" data-sv="${p.id}" aria-label="Save or unsave" onclick="save('${p.id}')">${heart(p.id)}</button><button class="act" onclick="item('${p.id}')">View</button></div></div></div>`;
      const PSEL = "id,title,price,images,seller_id,details,stock_level";

      /* LIVE SELLER ALERTS: toast, sound, vibration and phone notification the moment an order is ready */
      let alertCh = null;
      const ALERTED = new Set();
      function beep() {
        try {
          const c = new (window.AudioContext || window.webkitAudioContext)(),
            o = c.createOscillator();
          o.connect(c.destination);
          o.frequency.value = 880;
          o.start();
          o.stop(c.currentTime + 0.25);
        } catch (e) {}
      }
      function notifySeller(title, body) {
        beep();
        try {
          navigator.vibrate && navigator.vibrate([200, 100, 200]);
        } catch (e) {}
        try {
          if ("Notification" in window && Notification.permission === "granted")
            new Notification(title, { body });
        } catch (e) {}
        const d = document.createElement("div");
        d.setAttribute("role", "alert");
        d.style.cssText =
          "position:fixed;top:12px;left:12px;right:12px;z-index:99;background:#00a651;color:#fff;padding:14px;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)";
        d.innerHTML = `${esc(title)}<br><span style="font-weight:400">${esc(body)} · Tap to open</span>`;
        d.onclick = () => {
          d.remove();
          go("sorders");
        };
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 9000);
      }
      async function onOrderEvent(p) {
        const o = p.new;
        if (!o || ALERTED.has(o.id)) return;
        const cod = o.payment_method !== "in_app",
          ready = cod
            ? p.eventType === "INSERT"
            : PAIDSTATES.includes(o.status);
        if (!ready) return;
        ALERTED.add(o.id);
        notifySeller(
          cod ? "New order (cash on delivery)" : "New paid order. Deliver now",
          money(o.amount),
        );
        await loadTodo();
        tabs();
        if (view === "sorders") sorders();
      }
      function startAlerts() {
        if (alertCh) {
          sb.removeChannel(alertCh);
          alertCh = null;
        }
        if (!user || !profile || !["seller", "admin"].includes(profile.role))
          return;
        alertCh = sb
          .channel("orders-" + user.id)
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "orders",
              filter: "seller_id=eq." + user.id,
            },
            onOrderEvent,
          )
          .subscribe();
      }
      function enableAlerts() {
        if (!("Notification" in window))
          return alert("This phone or browser does not support notifications.");
        Notification.requestPermission().then(() => sorders());
      }
      let TODO = 0;
      async function loadTodo() {
        TODO = 0;
        if (!user || !profile || !["seller", "admin"].includes(profile.role))
          return;
        const { count } = await sb
          .from("orders")
          .select("*", { count: "exact", head: true })
          .eq("seller_id", user.id)
          .in("status", ["paid", "confirmed"]);
        TODO = count || 0;
      }
      function tabs() {
        const t = [["home", "🏠", "Home"]];
        if (user) t.push(["saved", "♥️", "Saved"]);
        if (user) t.push(["orders", "📦", "Orders"]);
        if (profile && ["seller", "admin"].includes(profile.role))
          t.push(
            ["sell", "🏪", "My shop"],
            ["sorders", "🧾", "Shop orders" + (TODO ? " (" + TODO + ")" : "")],
          );
        if (profile && profile.role === "promoter")
          t.push(["promote", "📣", "Promote"]);
        if (profile && profile.role === "admin")
          t.push(["admin", "🛡️", "Admin"]);
        t.push(["account", "👤", user ? "Account" : "Log in"]);
        $("tabs").innerHTML = t
          .map(
            ([k, i, l]) =>
              `<button class="${view === k ? "on" : ""}" onclick="go('${k}')"><b>${i}</b>${l}</button>`,
          )
          .join("");
      }
      async function setUser(u) {
        user = u || null;
        profile = null;
        if (user) {
          const load = async (cols) =>
            sb.from("profiles").select(cols).eq("id", user.id).maybeSingle();
          let r = await load("role,full_name,promo_code");
          if (r.error) r = await load("role,full_name");
          profile = r.data;
          // Someone who signed up as a promoter is approved automatically
          if (
            profile &&
            profile.role === "buyer" &&
            user.user_metadata?.role === "promoter"
          ) {
            const up = await sb.rpc("become_promoter");
            if (!up.error) {
              r = await load("role,full_name,promo_code");
              if (r.error) r = await load("role,full_name");
              profile = r.data;
            }
          }
        }
        await loadSaved();
        await loadTodo();
        startAlerts();
        document
          .querySelectorAll("[data-sv]")
          .forEach((b) => paintHearts(b.dataset.sv));
        tabs();
      }
      function go(v) {
        view = v;
        window.scrollTo(0, 0);
        tabs();
        ({ home, saved, orders, sell, sorders, account, admin, promote })[v]();
      }
      const back = () => go(prev || "home");

      /* INSTALL ON HOME SCREEN */
      const standalone = () =>
        matchMedia("(display-mode: standalone)").matches ||
        navigator.standalone;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });
      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        if (view === "home") home();
      });
      async function installApp() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          return;
        }
        alert(
          "To put Macstore on your home screen:\n\niPhone (Safari): tap the Share button, then Add to Home Screen.\n\nAndroid (Chrome): tap the ⋮ menu, then Install app or Add to Home screen.",
        );
      }
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {}),
        );

      /* HOME: banner, reviews, categories, endless grid loaded 20 at a time */
      function home() {
        if (io) io.disconnect();
        app.innerHTML = `<div class="banner"><h1>Shop from sellers across Ghana</h1><p>Pay on delivery or pick up near you.</p><a class="lnk" href="seller-signup.html">🏪 Become a seller</a><button class="lnk" style="width:100%" onclick="becomePromoter()">📣 Become a promoter</button>${standalone() ? "" : '<button class="lnk" style="width:100%" onclick="installApp()">📲 Install the app</button>'}</div>
   <div id="rev"></div>
   <div class="cats">${CATS.map(([c, i]) => `<button class="cat ${st.cat === c ? "on" : ""}" onclick="setCat('${c}')"><i>${i}</i>${c}</button>`).join("")}</div>
   <div class="cats" style="gap:6px;align-items:center"><input id="fmin" type="number" min="0" placeholder="Min GH₵" value="${st.min || ""}" style="width:96px" onchange="setFilter()"><input id="fmax" type="number" min="0" placeholder="Max GH₵" value="${st.max || ""}" style="width:96px" onchange="setFilter()"><select id="fsort" onchange="setFilter()" style="width:auto"><option value="new" ${st.sort === "new" || !st.sort ? "selected" : ""}>Newest</option><option value="low" ${st.sort === "low" ? "selected" : ""}>Price: low to high</option><option value="high" ${st.sort === "high" ? "selected" : ""}>Price: high to low</option></select></div>
   <div class="sec"><h2>${st.cat === "All" ? "Latest products" : esc(st.cat)}</h2><div id="g" class="grid"></div><div id="more" style="height:1px"></div></div>`;
        io = new IntersectionObserver(
          (e) => {
            if (e[0].isIntersecting) loadMore(false);
          },
          { rootMargin: "400px" },
        );
        io.observe($("more"));
        loadMore(true);
        loadReviews();
      }
      async function loadReviews() {
        const { data } = await sb
          .from("feedback")
          .select("name,rating,message")
          .eq("published", true)
          .order("created_at", { ascending: false })
          .limit(8);
        const box = $("rev");
        if (!box || !data || !data.length) return;
        box.innerHTML = `<div class="sec" style="margin-bottom:10px"><h2>What buyers say</h2><div class="rvs">${data
          .map(
            (r) =>
              `<div class="rv">${r.rating ? `<div class="st">${stars(r.rating)}</div>` : ""}<p>${esc(r.message)}</p><small>${esc(r.name || "Macstore buyer")}</small></div>`,
          )
          .join("")}</div></div>`;
      }
      function setFilter() {
        st.min = Number($("fmin").value) || 0;
        st.max = Number($("fmax").value) || 0;
        st.sort = $("fsort").value;
        loadMore(true);
      }
      function setCat(c) {
        st.cat = c;
        home();
      }
      async function loadMore(reset) {
        if (st.busy || (st.done && !reset)) return;
        st.busy = true;
        const g = $("g");
        if (reset) {
          st.from = 0;
          st.done = false;
          g.innerHTML = '<div class="sk"></div>'.repeat(6);
        }
        let r = sb
          .from("products")
          .select(PSEL)
          .eq("in_stock", true)

      async function saveProduct() {
        const m = $("m"),
          files = [...$("f").files].slice(0, 4),
          title = $("t").value.trim(),
          price = $("p").value;
        if (!title || !price) {
          m.className = "msg err";
          m.textContent = "Enter a name and a price.";
          return;
        }
        const pe = $("pe").checked,
          cm = Number($("cm").value || 0);
        if (pe && (cm < 2 || cm > 30)) {
          m.className = "msg err";
          m.textContent = "Enter a commission between 2% and 30%.";
          return;
        }
        m.className = "msg";
        m.textContent = "Saving…";
        let images = [];
        for (const file of files) {
          const path = `${user.id}/${Date.now()}-${file.name.replace(/[^\w.]/g, "_")}`;
          const up = await sb.storage
            .from("products")
            .upload(path, file, { cacheControl: "31536000" });
          if (up.error) {
            m.className = "msg err";
            m.textContent = up.error.message;
            return;
          }
          images.push(
            sb.storage.from("products").getPublicUrl(path).data.publicUrl,
          );
        }
        const details = {};
        document.querySelectorAll("#dl .dr").forEach((r) => {
          const k = r.querySelector(".dk").value.trim(),
            v = r.querySelector(".dv").value.trim();
          if (k && v) details[k] = v;
        });
        const level = $("sl").value,
          row = {
            title,
            description: $("d").value,
            price,
            details,
            category: $("c").value,
            stock_level: level,
            in_stock: level !== "out",
            promo_enabled: pe,
            commission_pct: pe ? cm : 0,
          };
        let error;
        if (EDIT) {
          if (images.length) row.images = images;
          ({ error } = await sb.from("products").update(row).eq("id", EDIT));
        } else {
          row.images = images;
          row.seller_id = user.id;
          ({ error } = await sb.from("products").insert(row));
        }
        if (error) {
          m.className = "msg err";
          m.textContent = error.message;
          return;
        }
        sell();
      }

      async function adDaily() {
        const d = $("pd").value,
          el = $("daily");
        if (!d) return;
        const [y, m, dd] = d.split("-").map(Number),
          iso = (x) => x.toISOString();
        const [day, mon, owed] = await Promise.all([
          sb
            .from("payouts")
            .select("role,amount")
            .gte("paid_at", iso(new Date(y, m - 1, dd)))
            .lt("paid_at", iso(new Date(y, m - 1, dd + 1))),
          sb
            .from("payouts")
            .select("role,amount")
            .gte("paid_at", iso(new Date(y, m - 1, 1)))
            .lt("paid_at", iso(new Date(y, m, 1))),
          sb
            .from("orders")
            .select(
              "amount,commission_amount,seller_paid,promoter_paid,payment_method",
            )
            .eq("status", "delivered"),
        ]);
        if (day.error) {
          el.innerHTML = `<p class="msg err">${esc(day.error.message)}</p>`;
          return;
        }
        const sum = (rows, role) =>
          (rows || [])
            .filter((r) => r.role === role)
            .reduce((a, r) => a + Number(r.amount), 0);
        let os = 0,
          op = 0;
        (owed.data || []).forEach((o) => {
          const c = Number(o.commission_amount || 0);
          if (o.payment_method === "in_app" && !o.seller_paid)
            os += Number(o.amount) - c;
          if (c > 0 && !o.promoter_paid) op += c;
        });
        const st = [
          ["Paid to sellers that day", sum(day.data, "seller")],
          ["Paid to promoters that day", sum(day.data, "promoter")],
          ["Paid to sellers this month", sum(mon.data, "seller")],
          ["Paid to promoters this month", sum(mon.data, "promoter")],
          ["Still owed to sellers", os],
          ["Still owed to promoters", op],
        ];
        el.innerHTML = `<div class="stats">${st.map(([l, n]) => `<div class="stat"><b>${money(n)}</b>${l}</div>`).join("")}</div>`;
      }

              .map(
                (
                  u,
                ) => `<div class="mine"><span>${esc(u.full_name || "No name")}<small>Joined ${dt(u.created_at)} · ${u.id.slice(0, 8)}</small></span>
  <select aria-label="Role" onchange="setRole('${u.id}',this.value)">${opts(["buyer", "seller", "promoter", "admin"], u.role)}</select></div>`,
              )
              .join("");
        adEl().innerHTML = `<h2>Seller applications</h2>${sellerHTML}<h2>All users</h2>${usersHTML}`;
      }

      async function viewDocs(id) {
        const box = $("ph-" + id);
        box.textContent = "Loading…";
        const { data: v } = await sb
          .from("seller_verification")
          .select("id_photo_path,selfie_path")
          .eq("user_id", id)
          .maybeSingle();
        const paths = [v?.id_photo_path, v?.selfie_path].filter(Boolean);
        if (!paths.length) {
          box.textContent = "No photos uploaded.";
          return;
        }
        const { data, error } = await sb.storage
          .from("seller-docs")
          .createSignedUrls(paths, 300);
        if (error || !data) {
          box.innerHTML = `<span class="err msg">${esc(error?.message || "Could not load photos")}</span>`;
          return;
        }
        box.innerHTML = data
          .map(
            (d) =>
              `<a href="${esc(d.signedUrl)}" target="_blank" rel="noopener"><img src="${esc(d.signedUrl)}" alt="Seller photo" style="width:130px;height:130px;border-radius:8px;object-fit:cover"></a>`,
          )
          .join("");
      }

      async function decide(id, status) {
        if (
          !confirm(
            (status === "approved" ? "Approve" : "Reject") + " this seller?",
          )
        )
          return;
        const a = await sb
          .from("seller_verification")
          .update({ status })
          .eq("user_id", id);
        if (a.error) return alert(a.error.message);
        const b =
          status === "approved"
            ? await sb.from("profiles").update({ role: "seller" }).eq("id", id)
            : await sb
                .from("profiles")
                .update({ role: "buyer" })
                .eq("id", id)
                .eq("role", "seller");
        if (b.error) return alert(b.error.message);
        adUsers();
      }

      async function setRole(id, role) {
        if (
          id === user.id &&
          role !== "admin" &&
          !confirm("You are removing your own admin access. Continue?")
        )
          return adUsers();
        const { error } = await sb
          .from("profiles")
          .update({ role })
          .eq("id", id);
        if (error) alert(error.message);
      }
      async function adPlans() {
        const { data, error } = await sb
          .from("subscriptions")
          .select("id,plan,status,current_period_end,profiles(full_name)")
          .order("current_period_end");
        adEl().innerHTML = error
          ? `<p class="err msg">${esc(error.message)}</p>`
          : (data || [])
              .map(
                (
                  x,
                ) => `<div class="mine"><span>${esc(x.profiles?.full_name || "Seller")} · ${esc(PLANS[x.plan]?.name || x.plan)}
   <small>${esc(x.status)} · until ${dt(x.current_period_end)}${PLANS[x.plan] || x.plan === "promoter" ? " · GH₵ " + (PLANS[x.plan]?.price ?? PROMO_PRICE) + " a month" : ""}</small></span>
   <button class="act g" onclick="markPaid('${x.id}','${x.current_period_end}')">Mark paid</button><button class="act r" onclick="suspendPlan('${x.id}')">Suspend</button></div>`,
              )
              .join("") || "<p>No seller plans yet.</p>";
      }
      async function markPaid(id, end) {
        const d = new Date(Math.max(Date.now(), new Date(end).getTime()));
        d.setMonth(d.getMonth() + 1);
        const { error } = await sb
          .from("subscriptions")
          .update({ status: "active", current_period_end: d.toISOString() })
          .eq("id", id);
        if (error) alert(error.message);
        adPlans();
      }
      async function suspendPlan(id) {
        if (confirm("Suspend this plan?")) {
          await sb
            .from("subscriptions")
            .update({ status: "suspended" })
            .eq("id", id);
          adPlans();
        }
      }
      async function adProducts() {
        const { data, error } = await sb
          .from("products")
          .select("id,title,price,in_stock,images,created_at")
          .order("created_at", { ascending: false })
          .limit(100);
        adEl().innerHTML = error
          ? `<p class="err msg">${esc(error.message)}</p>`
          : (data || [])
              .map(
                (
                  p,
                ) => `<div class="mine ${p.in_stock ? "" : "sold"}">${p.images && p.images[0] ? `<img src="${esc(p.images[0])}" alt="" loading="lazy">` : ""}
   <span>${esc(p.title)}<small>${money(p.price)} · ${dt(p.created_at)}</small></span><button class="act" onclick="adStock('${p.id}',${!p.in_stock})">${p.in_stock ? "Hide" : "Show"}</button><button class="act r" onclick="adDel('${p.id}')">Delete</button></div>`,
              )
              .join("") || "<p>No products yet.</p>";
      }
      async function adStock(id, v) {
        await sb
          .from("products")
          .update({ in_stock: v, stock_level: v ? "in" : "out" })
          .eq("id", id);
        adProducts();
      }
      async function adDel(id) {
        if (confirm("Delete this product for good?")) {
          const { error } = await sb.from("products").delete().eq("id", id);
          if (error) alert(error.message);
          adProducts();
        }
      }
      async function adOrders() {
        const { data, error } = await sb
          .from("orders")
          .select(
            "id,amount,status,fulfilment,payment_method,delivery_address,phone,promo_code,promoter_id,guest_name,note,created_at,commission_amount,products(title)",
          )
          .order("created_at", { ascending: false })
          .limit(50);
        const names = {},
          pids = [
            ...new Set((data || []).map((o) => o.promoter_id).filter(Boolean)),
          ];
        if (pids.length) {
          const { data: pp } = await sb
            .from("profiles")
            .select("id,full_name")
            .in("id", pids);
          (pp || []).forEach((p) => (names[p.id] = p.full_name));
        }
        adEl().innerHTML = error
          ? `<p class="err msg">${esc(error.message)}</p>`
          : (data || [])
              .map(
                (
                  o,
                ) => `<div class="mine"><span>${esc(o.products?.title || "Product")} · ${money(o.amount)}<small>${dt(o.created_at)} · ${esc(o.fulfilment)} · ${esc(o.payment_method)}${o.delivery_address ? " · " + esc(o.delivery_address) : ""}${o.phone ? " · " + esc(o.phone) : ""}${o.note ? " · note: " + esc(o.note) : ""}${o.guest_name ? " · guest " + esc(o.guest_name) : ""}${o.promoter_id ? " · promoter " + esc(names[o.promoter_id] || "") + " (" + esc(o.promo_code || "") + ")" : ""}${o.commission_amount > 0 ? " · promoter commission " + money(o.commission_amount) : ""}</small></span>
   <select aria-label="Order status" onchange="setStatus('orders','${o.id}',this.value)">${opts(["awaiting_payment", "paid", "pending", "confirmed", "delivered", "cancelled"], o.status)}</select></div>`,
              )
              .join("") || "<p>No orders yet.</p>";
      }
      let OWED = {};
      async function adPayouts() {
        const [o, w] = await Promise.all([
          sb
            .from("orders")
            .select(
              "id,amount,commission_amount,seller_id,promoter_id,seller_paid,promoter_paid,payment_method",
            )
            .eq("status", "delivered"),
          sb
            .from("app_settings")
            .select("value")
            .eq("key", "admin_whatsapp")
            .maybeSingle(),
        ]);
        OWED = {};
        const add = (uid, role, amt, id, flag) => {
          if (!uid || amt <= 0) return;
          const k = role + uid;
          OWED[k] = OWED[k] || { uid, role, amt: 0, ids: [], flag };
          OWED[k].amt += amt;
          OWED[k].ids.push(id);
        };
        (o.data || []).forEach((r) => {
          const c = Number(r.commission_amount || 0);
          if (r.payment_method === "in_app" && !r.seller_paid)
            add(
              r.seller_id,
              "seller",
              Number(r.amount) - c,
              r.id,
              "seller_paid",
            );
          if (r.promoter_id && !r.promoter_paid)
            add(r.promoter_id, "promoter", c, r.id, "promoter_paid");
        });
        const list = Object.entries(OWED),
          ids = [...new Set(list.map(([, x]) => x.uid))],
          [pd, pf] = ids.length
            ? await Promise.all([
                sb.from("payout_details").select("*").in("user_id", ids),
                sb.from("profiles").select("id,full_name").in("id", ids),
              ])
            : [{ data: [] }, { data: [] }];
        const bank = Object.fromEntries(
            (pd.data || []).map((x) => [x.user_id, x]),
          ),
          nm = Object.fromEntries(
            (pf.data || []).map((x) => [x.id, x.full_name]),
          );
        const row = ([k, x]) => {
          const b = bank[x.uid];
          return `<div class="mine"><span>${esc(nm[x.uid] || "User")}<small><b>${money(x.amt)}</b> · ${b ? esc(b.network) + " " + esc(b.momo_number) + " (" + esc(b.account_name) + ")" : "No MoMo number added yet"}</small></span>${b ? `<button class="act g" onclick="markPayout('${k}')">Mark as paid</button>` : ""}</div>`;
        };
        const sec = (title, role) => {
          const rows = list.filter(([, x]) => x.role === role),
            tot = rows.reduce((a, [, x]) => a + x.amt, 0);
          return (
            `<h2>${title} · ${money(tot)}</h2>` +
            (rows.map(row).join("") || "<p>Nothing to pay right now.</p>")
          );
        };
        adEl().innerHTML = `<div class="box" style="max-width:none"><h2>Your WhatsApp number</h2><p style="margin:0;color:var(--mut)">Approved sellers and promoters see a chat button with this number.</p><input id="aw" type="tel" placeholder="e.g. 0241234567" value="${esc(w.data?.value || "")}"><button class="act g" onclick="saveWa()">Save number</button><div id="aws" class="msg"></div></div>
   <h2>Money to pay out</h2><p style="margin:0 0 8px;color:var(--mut)">Delivered orders only. Sellers are listed for in-app payments. Cash-on-delivery sales are already with the seller.</p>
   ${sec("Sellers to pay", "seller")}
   ${sec("Promoters to pay", "promoter")}`;
      }
      async function adReports() {
        const { data, error } = await sb
          .from("reports")
          .select("id,product_id,reason,status,created_at")
          .order("created_at", { ascending: false })
          .limit(50);
        adEl().innerHTML = error
          ? `<p class="msg err">${esc(error.message)}</p>`
          : (data || [])
              .map(
                (r) =>
                  `<div class="mine"><span>${esc(r.reason)}<small>${dt(r.created_at)} · ${esc(r.status)}</small></span><button class="act" onclick="item('${r.product_id}')">View item</button>${r.status === "open" ? `<button class="act g" onclick="setStatus('reports','${r.id}','resolved');adReports()">Resolve</button>` : ""}</div>`,
              )
              .join("") || "<p>No reports.</p>";
      }
      async function saveWa() {
        const { error } = await sb
          .from("app_settings")
          .upsert({ key: "admin_whatsapp", value: $("aw").value.trim() });
        $("aws").className = error ? "msg err" : "msg ok";
        $("aws").textContent = error ? error.message : "✓ Saved.";
      }
      async function markPayout(k) {
        const x = OWED[k];
        if (
          !x ||
          !confirm(
            `Mark ${money(x.amt)} as paid? Do this only after you have sent the MoMo payment.`,
          )
        )
          return;
        const { error } = await sb
          .from("orders")
          .update({ [x.flag]: true })
          .in("id", x.ids);
        if (error) return alert(error.message);
        const log = await sb.from("payouts").insert({
          user_id: x.uid,
          role: x.role,
          amount: x.amt,
          order_ids: x.ids,
        });
        if (log.error)
          alert(
            "Marked as paid, but it could not be saved to the daily totals: " +
              log.error.message,
          );
        adPayouts();
      }
      async function adRefunds() {
        const { data, error } = await sb
          .from("refunds")
          .select("id,reason,status,created_at")
          .order("created_at", { ascending: false })
          .limit(50);
        adEl().innerHTML = error
          ? `<p class="err msg">${esc(error.message)}</p>`
          : (data || [])
              .map(
                (
                  r,
                ) => `<div class="mine"><span>${esc(r.reason || "No reason given")}<small>${dt(r.created_at)}</small></span>
   <select aria-label="Refund status" onchange="setStatus('refunds','${r.id}',this.value)">${opts(["open", "approved", "rejected", "refunded"], r.status)}</select></div>`,
              )
              .join("") || "<p>No refund requests.</p>";
      }
      async function setStatus(table, id, status) {
        const { error } = await sb.from(table).update({ status }).eq("id", id);
        if (error) alert(error.message);
      }
      /* Buyer reviews: only the admin sees them all and chooses which to publish */
      async function adFeedback() {
        const { data, error } = await sb
          .from("feedback")
          .select("id,message,rating,name,published,created_at")
          .order("created_at", { ascending: false })
          .limit(100);
        adEl().innerHTML = error
          ? `<p class="err msg">${esc(error.message)}</p>`
          : (data || [])
              .map(
                (
                  f,
                ) => `<div class="mine"><span>${f.rating ? `<span style="color:var(--or)">${stars(f.rating)}</span><br>` : ""}${esc(f.message)}<small>${esc(f.name || "Buyer")} · ${dt(f.created_at)} · <b>${f.published ? "Published on the site" : "Hidden"}</b></small></span>
   <button class="act ${f.published ? "sv" : "g"}" onclick="pubFeedback('${f.id}',${!f.published})">${f.published ? "Unpublish" : "Publish"}</button><button class="act r" onclick="delFeedback('${f.id}')">Delete</button></div>`,
              )
              .join("") || "<p>No reviews yet.</p>";
      }
      async function pubFeedback(id, v) {
        const { error } = await sb
          .from("feedback")
          .update({ published: v })
          .eq("id", id);
        if (error) alert(error.message);
        adFeedback();
      }
      async function delFeedback(id) {
        if (!confirm("Delete this review?")) return;
        const { error } = await sb.from("feedback").delete().eq("id", id);
        if (error) alert(error.message);
        adFeedback();
      }

      /* PROMOTER HUB */
      const PROMO_PRICE = 30;
      const refLink = (pid) =>
        location.origin +
        location.pathname +
        "?code=" +
        encodeURIComponent(profile?.promo_code || "") +
        "&p=" +
        pid;
      async function copyLink(pid) {
        const l = refLink(pid);
        try {
          await navigator.clipboard.writeText(l);
          alert(
            "Link copied. Buyers who open it get your promoter code filled in automatically.",
          );
        } catch (e) {
          prompt("Copy your link:", l);
        }
      }
      async function copyCode() {
        const c = profile?.promo_code || "";
        try {
          await navigator.clipboard.writeText(c);
          alert("Code copied: " + c);
        } catch (e) {
          prompt("Copy your code:", c);
        }
      }
      async function promote() {
        app.innerHTML =
          '<div id="plan"><div class="sk"></div></div><div id="hub"></div>';
        const pl = $("plan"),
          hub = $("hub");
        const getSub = () =>
          sb
            .from("subscriptions")
            .select("plan,status,current_period_end")
            .eq("user_id", user.id)
            .maybeSingle();
        let { data: sub } = await getSub();
        if (!sub) {
          // Registered automatically: the free month starts by itself
          const r = await sb.rpc("start_plan", { p: "promoter" });
          if (!r.error) ({ data: sub } = await getSub());
        }
        if (!sub) {
          pl.innerHTML = `<div class="box" style="max-width:none"><h2>Become a Macstore promoter</h2><p>Share products with your own link and earn the seller’s commission on every sale. Your first month is free, then GH₵ ${PROMO_PRICE} a month.</p><button class="act g" onclick="startPlan('promoter')">Start free month</button></div>`;
          return;
        }
        const end = new Date(sub.current_period_end),
          active = ["trial", "active"].includes(sub.status) && end > new Date(),
          left = Math.max(0, Math.ceil((end - Date.now()) / 864e5));
        pl.innerHTML = `<div class="box" style="max-width:none"><h2>Your promoter code</h2>
   <div class="code">${esc(profile?.promo_code || "Generating…")}</div>
   <button class="act" onclick="copyCode()">Copy my code</button>
   <p style="margin:0">Tell buyers to type this code when they order. Every sale with your code is credited to you.</p>
   <p style="margin:0"><b>Promoter plan · ${sub.status === "trial" ? "free month" : esc(sub.status)}</b><br>${active ? `${left} day${left === 1 ? "" : "s"} left, until ${dt(end)}.` : "Your plan has ended."}</p>${active ? "" : `<p class="msg err">To keep earning, pay GH₵ ${PROMO_PRICE} for the next month. Your account and code stay yours.</p><button class="act g" onclick="payPlan('promoter')">Pay GH₵ ${PROMO_PRICE} with Paystack</button>`}</div>`;
        if (!active) return;
        const [p, o] = await Promise.all([
          sb
            .from("products")
            .select("id,title,price,images,commission_pct")
            .eq("promo_enabled", true)
            .eq("in_stock", true)
            .order("created_at", { ascending: false })
            .limit(100),
          sb
            .from("orders")
            .select(
              "commission_amount,status,promoter_paid,created_at,products(title)",
            )
            .eq("promoter_id", user.id)
            .order("created_at", { ascending: false })
            .limit(1000),
        ]);
        const ords = o.data || [],
          sum = (f) =>
            ords.filter(f).reduce((a, x) => a + Number(x.commission_amount), 0);
        hub.innerHTML = `<div class="stats"><div class="stat"><b>${money(sum((x) => x.status === "delivered"))}</b>Total earned</div><div class="stat"><b>${money(sum((x) => x.status === "delivered" && x.promoter_paid))}</b>Paid to you</div><div class="stat"><b>${money(sum((x) => x.status === "delivered" && !x.promoter_paid))}</b>Waiting for payout</div><div class="stat"><b>${money(sum((x) => !["delivered", "cancelled"].includes(x.status)))}</b>Not delivered yet</div></div>
   <h2>Products you can promote</h2>${(p.data || []).map((x) => `<div class="mine">${x.images && x.images[0] ? `<img src="${esc(x.images[0])}" alt="" loading="lazy">` : ""}<span>${esc(x.title)}<small>${money(x.price)} · you earn ${money((x.price * x.commission_pct) / 100)} (${x.commission_pct}%)</small></span><button class="act" onclick="copyLink('${x.id}')">Copy my link</button></div>`).join("") || "<p>No products are open to promoters yet.</p>"}
   <h2>Your sales</h2>${
     ords
       .slice(0, 30)
       .map(
         (x) =>
           `<div class="mine"><span>${esc(x.products?.title || "Product")}<small>${dt(x.created_at)} · ${esc(x.status)}${x.promoter_paid ? " · paid to you" : ""}</small></span><b>${money(x.commission_amount)}</b></div>`,
       )
       .join("") || "<p>No sales through your code yet.</p>"
   }`;
      }

      /* Shared promoter links: ?code=PRO-XXXXX&p=<product id> (older ?ref= links still work) */
      const UUID =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      (() => {
        const q = new URLSearchParams(location.search),
          r = q.get("ref"),
          c = q.get("code");
        try {
          if (r && UUID.test(r)) localStorage.setItem("mac_ref", r);
          if (c && /^[A-Za-z0-9-]{4,20}$/.test(c))
            localStorage.setItem("mac_code", c.toUpperCase());
        } catch (e) {}
      })();

      (async () => {
        const { data } = await sb.auth.getSession();
        await setUser(data.session?.user);
        sb.auth.onAuthStateChange((_e, s) =>
          setTimeout(() => setUser(s?.user), 0),
        );
        const sp = new URLSearchParams(location.search).get("p");
        if (sp && UUID.test(sp)) item(sp);
        else go("home");
      })();
    </script>
  </body>
</html>
